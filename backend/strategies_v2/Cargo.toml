[package]
name = "{{CRATE_NAME}}"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "{{CRATE_NAME}}_worker"
path = "worker.rs"

[[bin]]
name = "{{CRATE_NAME}}_simulator"
path = "simulator.rs"

[[bin]]
name = "{{CRATE_NAME}}_optimizer"
path = "optimizer.rs"

[dependencies]
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = false
codegen-units = 8
panic = "abort"
